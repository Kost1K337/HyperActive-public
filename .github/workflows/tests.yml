name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # torch is installed from the CPU wheel index before the rest of the
      # dependencies: an unpinned resolution on Linux can otherwise pull the
      # CUDA build and ~2 GB of nvidia-* packages even though this project
      # never touches a GPU (torch==2.7.1 is pinned exactly in pyproject.toml
      # precisely because stable-baselines3's own resolution can drift the
      # pin upward otherwise; see docs/reproducing.md).
      - name: Install torch (CPU wheels)
        run: pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.7.1"

      - name: Install the package
        run: pip install -e ".[dev]"

      - name: Assert no CUDA/nvidia packages were pulled in
        run: |
          if pip list --format=freeze | grep -qi '^nvidia-'; then
            echo "::error::nvidia-* packages present; the CPU torch index was bypassed" >&2
            pip list --format=freeze | grep -i '^nvidia-'
            exit 1
          fi

      - name: Lint (ruff)
        run: ruff check .

      - name: Test
        run: pytest -v

  package-metadata:
    # A minimal, independent check that the package installs and imports
    # cleanly under the *default* PyPI index (no pinned CPU torch), so a
    # dependency resolution regression is caught even without a GPU-cost
    # concern - this job is not expected to skip any nvidia packages.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: python -c "import hyperactive; print(hyperactive.__version__)"
      - run: hyperactive-plan --help
