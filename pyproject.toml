[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hyperactive"
version = "0.1.0"
description = "Reinforcement learning (masked C-DQN) for sequencing well construction under crew, time and production constraints"
requires-python = ">=3.10,<3.14"
license = "Apache-2.0"
dependencies = [
    "numpy>=2.2",
    "pandas>=2.2",
    "openpyxl>=3.1.5",
    "pydantic>=2.10",
    # Exact pins: the released weights are loaded with these versions, and
    # stable-baselines3 >= 2.8 requires torch >= 2.8.
    "torch==2.7.1",
    "stable-baselines3==2.7.1",
    "gymnasium>=1.2.3,<1.3.0",
]

[project.optional-dependencies]
# Experiment tracking. mlflow-skinny is enough to log to a tracking server;
# the full package also brings `mlflow ui` for the local file store.
tracking = ["mlflow>=2.17,<3"]
plots = ["matplotlib>=3.9"]
dev = ["pytest>=8", "ruff>=0.6", "mlflow>=2.17,<3"]

[project.scripts]
hyperactive-plan = "hyperactive.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "ignore::DeprecationWarning:pkg_resources",
]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
# Correctness signal only (unused imports/names, undefined names, obvious
# pyflakes/pycodestyle errors) - matches Ruff's own documented default
# selection, pinned explicitly so it does not drift with the Ruff version.
# Deliberately not opinionated style/modernisation rule sets (UP, DTZ, BLE,
# SIM, TRY, PLR/PLW, RUF, ...): this project's existing style (naive
# datetimes throughout, broad `except Exception` where a computation must
# never break an experiment - see e.g. hyperactive.tracking) is intentional,
# and those rules were never part of it.
select = ["E4", "E7", "E9", "F"]
